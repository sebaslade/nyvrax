[workspace]
members = [
    "crates/nyvrax-core",
    "crates/nyvrax-reporters",
    "crates/nyvrax-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Nyvrax contributors"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

nyvrax-core = { path = "crates/nyvrax-core" }
nyvrax-reporters = { path = "crates/nyvrax-reporters" }